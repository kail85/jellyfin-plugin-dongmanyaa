name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test Jellyfin.Plugin.DongmanYaa.sln --configuration Release --nologo
      - run: dotnet build Jellyfin.Plugin.DongmanYaa.sln --configuration Release --nologo
